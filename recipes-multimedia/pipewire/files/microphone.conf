# create microphone
context.objects = [
    { factory = adapter
        args = {
            factory.name           = api.alsa.pcm.source
            node.name              = "dmic1_input"
            node.description       = "ALSA Source on record_dmic0"
            media.class            = "Audio/Source"
            api.alsa.path          = "record_dmic0"
            monitor.channel-volumes = true
            audio.channels         = "2"
            audio.position         = "FL, FR"
        }
        flags = [ ifexists nofail ]
    }
    { factory = adapter
        args = {
            factory.name           = api.alsa.pcm.source
            node.name              = "dmic2_input"
            node.description       = "ALSA Source on record_dmic1"
            media.class            = "Audio/Source"
