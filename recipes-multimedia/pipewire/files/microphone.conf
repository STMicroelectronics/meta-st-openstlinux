]
context.modules = [
# stereo microphone for stm32mp257f-dk
{   name = libpipewire-module-combine-stream
    args = {
        combine.mode = source
        node.name = "stereo_micro_dk"
        node.description = "Stereo Microphone"
        #combine.latency-compensate = false
        combine.props = {
            audio.position = [ FL FR ]
        }
        stream.rules = [
                {
                    matches = [
                        {
                        media.class    = "Audio/Source"
                        node.name      = "dmic1_input"
                        }
                    ]
                    actions = {
                        create-stream = {
                           audio.position = [ FL ]
                           combine.audio.position = [ FL ]
                        }
                    }
                }
                {
                    matches = [
                        {
                        media.class    = "Audio/Source"
                        node.name      = "dmic2_input"
                        }
                    ]
                    actions = {
                        create-stream = {
                           audio.position = [ FR ]
                           combine.audio.position = [ FR ]
                        }
                    }
                }
        ]
    }
}
]
