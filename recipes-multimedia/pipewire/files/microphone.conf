    { factory = adapter
        args = {
            factory.name           = api.alsa.pcm.source
            node.name              = "iec958_input"
            node.description       = "ALSA Source on record_spdif"
            media.class            = "Audio/Source"
            api.alsa.path          = "record_spdif"
            monitor.channel-volumes = true
