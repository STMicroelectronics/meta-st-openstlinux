#@NAME: openstlinux-weston-nopie
#@DESCRIPTION: OpenSTLinux featuring Weston/Wayland (with GPLv3 software) and no PIE actived on binaries
# PIE:  Position Independent Executable

require include/st-default-distro-rules.inc
require include/st-default-distro-providers.inc
require openstlinux-weston.conf

# =========================================================================
# Distribution definition for: st-openstlinux-weston-
# =========================================================================
DISTRO = "openstlinux-weston-nopie"
DISTRO_NAME = "ST OpenSTLinux - Weston  NO PIE - (A Yocto Project Based Distro)"

# =========================================================================
# DISTRO features
# =========================================================================
DISTRO_FEATURES:append = " opengl"
DISTRO_FEATURES:remove = " x11 "
# with X11
#PREFERRED_PROVIDER_virtual/xserver = "${@bb.utils.contains('DISTRO_FEATURES', 'x11 wayland', 'xwayland', 'xserver-xorg', d)}"

DISTRO_FEATURES:append = " gplv3 "

# activate GPU Vulkan & opencl
DISTRO_FEATURES:append = " ${@bb.utils.filter('MACHINE_FEATURES', 'vulkan opencl', d)} "

# =========================================================================
# SECURITY FLAGS
# =========================================================================
SECURITY_CFLAGS:remove = "${SECURITY_PIE_CFLAGS}"
GCCPIE ?= ""

PACKAGE_INSTALL:append = " dhrystone memtester"
